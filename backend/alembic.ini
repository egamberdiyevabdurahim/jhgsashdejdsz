# Alembic for the FastAPI backend. The URL comes from DATABASE_URL (app/settings.py), never from this file.
# Until cutover Drizzle (drizzle/, scripts/migrate.mjs) owns the schema; the baseline revision only checks that the database
# is at the Drizzle head it was generated from and records it (alembic_version lives in the `drizzle` schema, next to
# drizzle.__drizzle_migrations, so `public` is untouched).
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
