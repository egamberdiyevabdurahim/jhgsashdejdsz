[project]
name = "jg-backend"
version = "0.1.0"
description = "Jamals Global apps: the FastAPI backend (the /api/v1 contract of the Next.js server, ported)."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
  "cryptography>=43",
  # the engine port (app/engine): IANA zones on Windows too, and \p{L} / \p{Script=...} in its regexes
  "tzdata",
  "regex",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "sqlacodegen>=3.0.0",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
